name: Deploy web to GitHub Pages

# The frontend is a static Vite bundle, so Pages serves it directly. The API
# is deployed separately; the browser talks to it via VITE_API_BASE_URL.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a live one.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # From `.nvmrc`, so CI and local can't drift apart. Vite 8 / rolldown
          # needs >= 22.12, and jsdom won't load below it either.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      # The whole frontend suite: pure logic, hooks, and components. The
      # oldest part of it still earns its place first — `timerPlan.ts` is the
      # one reading of a workout that both the clock and the visualizer run
      # on, so a regression there is wrong in two places at once and visible
      # in neither until a workout is running.
      - run: npm test

      # Vite inlines env vars at build time, so this is baked into the bundle
      # (it's a public URL, not a secret). Set it as a repository *variable*
      # named VITE_API_BASE_URL, e.g. https://api.shortimer.com — until then
      # the bundle falls back to localhost and API calls will fail.
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      # Pages serves static files and has no SPA fallback, so /register,
      # /verify and /reset — the three addresses we *email people* — would
      # each return the 404 page. Pages does serve 404.html for anything it
      # can't match, so a copy of the app there makes those links load the app,
      # which then reads the path and token off the URL itself.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
