[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "short-timer"
version = "0.1.0"
description = "A programmable workout timer server: paste in a workout, get back a runnable timer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Michael Dupont" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymongo>=4.9",
    # Resolves mongodb+srv:// URIs (MongoDB Atlas). Current pymongo requires it
    # anyway, but the deployment depends on it, so declare it explicitly.
    "dnspython>=2.6",
    "anthropic>=0.40",
    "itsdangerous>=2.2",
    # Encrypts per-user third-party credentials at rest (see crypto.py).
    "cryptography>=43",
    # Capped at 1.x: mcp 2.0 removed `mcp.server.fastmcp`, which mcp_server.py
    # imports FastMCP from, so an unpinned resolve doesn't just fail to
    # type-check — it fails to import. uv.lock already resolves 1.28.1; this
    # says so in the place a fresh environment reads (CI builds its hatch env
    # from here, not from the lock). Lift it with the 2.x migration.
    "mcp>=1.2,<2",
    "httpx>=0.28",
    # Extracts visible text from fetched HTML. Was a `scrape` extra back when
    # only the fixture script used it; the Wodify intakes parse HTML at
    # runtime, so it has to be in the image the API actually ships.
    "beautifulsoup4>=4.12",
]

[project.scripts]
short-timer-server = "short_timer.app:run"
short-timer-mcp = "short_timer.mcp_server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/short_timer"]

[tool.hatch.envs.default]
installer = "uv"
dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mongomock-motor>=0.0.34",
    "respx>=0.22",
    "httpx>=0.28",
    "mypy>=1.13",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
types = "mypy {args:src}"
serve = "uvicorn short_timer.app:app --reload {args}"
mcp = "python -m short_timer.mcp_server {args}"
scrape = "python scripts/scrape_workouts.py {args}"
seed-data = "python scripts/build_benchmark_seed.py {args}"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the real Anthropic API; needs a real ANTHROPIC_API_KEY"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["short_timer"]
